name: Release-Paket bauen

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, mbstring, pdo_mysql
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version aus dem Release-Tag übernehmen
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
      - run: npm ci && npm run build

      - name: Paket zusammenstellen
        run: |
          VERSION="$(cat VERSION)"
          mkdir -p dist
          zip -rq "dist/vylaris-tickets-${VERSION}.zip" . \
            -x ".git/*" ".github/*" "node_modules/*" "tests/*" "dist/*" ".env" "storage/logs/*" "storage/framework/cache/*" "storage/framework/sessions/*" "storage/framework/views/*" "database/*.sqlite" "public/hot"
          (cd dist && sha256sum "vylaris-tickets-${VERSION}.zip" > "vylaris-tickets-${VERSION}.zip.sha256")

      - name: An das Release anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
